[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iterator-pet"
version = "0.6.0"
requires-python = ">=3.12"
# UnityPy 只在“从本机游戏切素材”时才用；缺了也能跑（用程序内生成的图元兜底），
# 但发布版必须带上，否则第一次运行拿不到真精灵。
dependencies = [
    "PySide6>=6.6", "UnityPy>=1.20", "Pillow>=10",
    "winrt-Windows.Media.Ocr>=4!10.0.28000.2705; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=4!10.0.28000.2705; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=4!10.0.28000.2705; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "rapidfuzz>=3", "pypinyin>=0.50",
]

[project.optional-dependencies]
# 读 PDF / PPT / Word / Excel、把讲义导出成 docx（brain/docs.py）：体积大，不装只是这两项用不了
docs = ["markitdown[pdf,docx,pptx,xlsx]>=0.1.5", "python-docx>=1.1"]
dev = ["pytest>=8", "pytest-xdist>=3","pyinstaller>=6.0", "markitdown[pdf,docx,pptx,xlsx]>=0.1.5", "python-docx>=1.1"]

[project.scripts]
iterator-pet = "iterator_pet.main:main"
iterator-pet-launch = "iterator_pet.launcher:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: 长时间物理仿真，只在全量档跑"]
# 默认快速档：6 进程并行、跳过 slow；全量档 pytest -m "slow or not slow"
addopts = "-n 6 -m \"not slow\""

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iterator_pet = ["assets/*.png"]
